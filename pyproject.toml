[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytubular"
version = "0.9.0a1"
description = "Python TubULAR experiment interface and validated numerical geometry core"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "licenses/*.txt"]
authors = [{name = "Mitchell Lab"}]
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
tubular = "tubular.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tubular = ["matlab_methods.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]
